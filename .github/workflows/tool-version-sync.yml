name: Tool Version Sync

# Asserts that the image pins in `versions/Dockerfile` match the pins used
# in composite-action `default:` values and shell scripts. Fails the build
# if they drift — typically when Dependabot has bumped the Dockerfile but
# the consumer files haven't been propagated yet. Fix with:
#   tools/sync-tool-versions.sh --apply

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Versions in sync
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Run sync check
        id: sync_check
        run: tools/sync-tool-versions.sh --check

      - name: Test the propagation script
        run: tools/test-sync-tool-versions.sh

      - name: Explain how to fix drift
        if: failure() && steps.sync_check.outcome == 'failure'
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Tool version drift

          The pins in `versions/Dockerfile` do not match the consumer files
          (composite-action `default:` values and shell scripts).

          Fix it with a single command on this branch:

          ```bash
          tools/sync-tool-versions.sh --apply
          ```

          Then commit the result and push.

          No local clone needed: run the `Tool Version Autosync` workflow from
          the Actions tab, pass this PR's branch name, and it will propagate
          the pins and push the commit for you.
          SUMMARY
